name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            onnx_url: "https://github.com/microsoft/onnxruntime/releases/download/v1.17.0/onnxruntime-linux-x64-1.17.0.tgz"
            onnx_lib: "libonnxruntime.so.1.17.0"
            archive_ext: "tar.gz"
          - os: macos-latest
            target: darwin-arm64
            onnx_url: "https://github.com/microsoft/onnxruntime/releases/download/v1.17.0/onnxruntime-osx-arm64-1.17.0.tgz"
            onnx_lib: "libonnxruntime.1.17.0.dylib"
            archive_ext: "tar.gz"
          - os: windows-latest
            target: windows-amd64
            onnx_url: "https://github.com/microsoft/onnxruntime/releases/download/v1.17.0/onnxruntime-win-x64-1.17.0.zip"
            onnx_lib: "onnxruntime.dll"
            archive_ext: "zip"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Download Runtimes
        shell: bash
        run: |
          PLATFORM=""
          if [[ "${{ matrix.target }}" == windows* ]]; then PLATFORM="windows"; fi
          if [[ "${{ matrix.target }}" == linux* ]]; then PLATFORM="linux"; fi
          if [[ "${{ matrix.target }}" == darwin* ]]; then PLATFORM="darwin"; fi
          task download-onnx PLATFORM=$PLATFORM
          task download-tokenizers PLATFORM=$PLATFORM

      - name: Build Binaries
        shell: bash
        run: |
          PLATFORM=""
          if [[ "${{ matrix.target }}" == windows* ]]; then PLATFORM="windows"; fi
          if [[ "${{ matrix.target }}" == linux* ]]; then PLATFORM="linux"; fi
          if [[ "${{ matrix.target }}" == darwin* ]]; then PLATFORM="darwin"; fi
          task build PLATFORM=$PLATFORM

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          EXT=""
          if [[ "${{ matrix.target }}" == windows* ]]; then EXT=".exe"; fi
          LIB_EXT="so"
          if [[ "${{ matrix.target }}" == windows* ]]; then LIB_EXT="dll"; fi
          if [[ "${{ matrix.target }}" == darwin* ]]; then LIB_EXT="dylib"; fi
          
          # In Taskfile build, binaries are placed in bin/
          cp bin/mlcembedder${EXT} bin/preloader${EXT} bin/cli${EXT} release/
          cp LICENSE README.md config.yaml release/
          
          # Copy ONNX lib (task download-onnx puts it in root)
          cp *onnxruntime.${LIB_EXT}* release/ 2>/dev/null || cp libonnxruntime.${LIB_EXT} release/
          
          # Add README note about models using a simpler append
          echo "" >> release/README.md
          echo "## Important Note" >> release/README.md
          echo "Models are not included in this release. Use the './preloader' tool to download them." >> release/README.md
          
          cd release
          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            if command -v zip >/dev/null 2>&1; then
              zip -r ../mlc-localembed-${{ matrix.target }}.zip *
            else
              7z a ../mlc-localembed-${{ matrix.target }}.zip *
            fi
          else
            tar -czf ../mlc-localembed-${{ matrix.target }}.tar.gz *
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: mlc-localembed-${{ matrix.target }}.${{ matrix.archive_ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
