name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Download Runtimes
        shell: bash
        run: |
          task download-onnx
          task download-tokenizers

      - name: Run Tests
        env:
          ONNX_PATH: ${{ github.workspace }}/libonnxruntime.so
          GOWORK: "off"
        run: task test

      - name: Build Check
        env:
          GOWORK: "off"
        run: task build

