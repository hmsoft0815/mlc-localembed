version: '3'

dotenv: ['.env']

vars:
  # Detect OS and set library extension
  LIB_EXT:
    sh: |
      if [ "$(uname)" == "Darwin" ]; then
        echo "dylib"
      elif [ "$(expr substr $(uname -s) 1 5)" == "Linux" ]; then
        echo "so"
      else
        echo "dll"
      fi
  ONNX_LIB: "libonnxruntime.{{.LIB_EXT}}"

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Complete initial setup (Download ONNX, Download Tokenizers, Build, Preload models)
    cmds:
      - task: download-onnx
      - task: download-tokenizers
      - task: deps
      - task: build
      - task: preload

  deps:
    desc: Ensure all dependencies are downloaded
    env:
      GOWORK: "off"
    cmds:
      - go mod download
      - go mod tidy

  build:
    desc: Build all binaries (including Cross-Platform GUI)
    vars:
      TARGET_OS: '{{default OS .PLATFORM}}'
    env:
      GOWORK: "off"
      CGO_LDFLAGS: "-L{{.TASKFILE_DIR}}"
      CGO_ENABLED: "1"
    cmds:
      - task: deps
      - mkdir -p bin
      - |
        if [ "{{.TARGET_OS}}" == "windows" ]; then
          GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc go build -o bin/mlcembedder.exe ./cmd/server/main.go
          GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc go build -o bin/cli.exe ./cmd/cli/main.go
          GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc go build -o bin/preloader.exe ./cmd/preloader/main.go
          GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc go build -ldflags="-H windowsgui" -o bin/localembed-gui.exe ./cmd/gui
        else
          go build -o bin/mlcembedder ./cmd/server/main.go
          go build -o bin/cli ./cmd/cli/main.go
          go build -o bin/preloader ./cmd/preloader/main.go
          if [ "$(uname)" == "Darwin" ] && [ "{{.TARGET_OS}}" != "linux" ]; then
            go build -o bin/localembed-gui ./cmd/gui
          fi
        fi

  clean:
    desc: Remove binaries and temporary files
    cmds:
      - rm -rf bin
      - rm -rf cmd/gui-win

  test:
    desc: Run tests
    env:
      ONNX_PATH: "{{.TASKFILE_DIR}}/{{.ONNX_LIB}}"
      GOWORK: "off"
      CGO_LDFLAGS: "-L{{.TASKFILE_DIR}}"
    cmds:
      - go test ./...

  run:
    desc: Run the server (foreground)
    env:
      ONNX_PATH: "{{.TASKFILE_DIR}}/{{.ONNX_LIB}}"
      GOWORK: "off"
    cmds:
      - ./bin/mlcembedder

  start:
    desc: Start the server in background (using PID file)
    env:
      ONNX_PATH: "{{.TASKFILE_DIR}}/{{.ONNX_LIB}}"
      GOWORK: "off"
    cmds:
      - |
        if [ -f server.pid ]; then
          PID=$(cat server.pid)
          if kill -0 $PID 2>/dev/null; then
            echo "Server already running (PID $PID)"
            exit 1
          fi
          rm server.pid
        fi
        nohup ./bin/mlcembedder > server.log 2>&1 &
        sleep 1
        pgrep -f bin/mlcembedder | head -n 1 > server.pid
        if [ -s server.pid ]; then
          echo "Server started (PID $(cat server.pid), log: server.log)"
        else
          echo "Failed to start server"
          rm server.pid
          exit 1
        fi

  stop:
    desc: Stop the server (using PID file)
    cmds:
      - |
        if [ -f server.pid ]; then
          PID=$(cat server.pid)
          if kill $PID 2>/dev/null; then
             rm server.pid
             echo "Server (PID $PID) stopped"
          else
             echo "Process $PID not found, cleaning up PID file"
             rm server.pid
          fi
        else
          pkill -f bin/mlcembedder && echo "Server stopped (via pkill)" || echo "Server not running"
        fi

  ping:
    desc: Check server health and stats
    cmds:
      - |
        URL=${MLC_BASE_URL:-"http://localhost:9142"}
        if ! curl -s "$URL/api/health" > /dev/null; then
          echo "Server is NOT running at $URL"
          exit 0
        fi
        echo "--- Health ---"
        curl -s "$URL/api/health" | jq . || curl -s "$URL/api/health"
        echo -e "\n--- Stats ---"
        curl -s "$URL/api/stats" | jq . || curl -s "$URL/api/stats"

  compare-ollama:
    desc: Compare embeddings with Ollama reference
    cmds:
      - go run tests/integration/compare_ollama.go

  test-curl:
    desc: Run curl-based integration tests
    cmds:
      - ./tests/run_curl_tests.sh

  download-onnx:
    desc: Download ONNX runtime library for the current platform (or specify PLATFORM=linux/darwin)
    vars:
      TARGET_OS: '{{default OS .PLATFORM}}'
    cmds:
      - |
        OS="{{.TARGET_OS}}"
        if [ -z "$OS" ]; then OS=$(uname | tr '[:upper:]' '[:lower:]'); fi
        ARCH=$(uname -m)
        echo "Downloading ONNX for $OS ($ARCH)..."
        mkdir -p .onnx_tmp
        if [ "$OS" == "darwin" ] || [ "$OS" == "macos" ]; then
          if [ "$ARCH" == "arm64" ]; then
            URL="https://github.com/microsoft/onnxruntime/releases/download/v1.17.0/onnxruntime-osx-arm64-1.17.0.tgz"
          else
            URL="https://github.com/microsoft/onnxruntime/releases/download/v1.17.0/onnxruntime-osx-x86_64-1.17.0.tgz"
          fi
        elif [ "$OS" == "linux" ]; then
          URL="https://github.com/microsoft/onnxruntime/releases/download/v1.17.0/onnxruntime-linux-x64-1.17.0.tgz"
        elif [ "$OS" == "windows" ] || [ "$OS" == "win32" ]; then
          URL="https://github.com/microsoft/onnxruntime/releases/download/v1.17.0/onnxruntime-win-x64-1.17.0.zip"
        fi

        # Apply local cache proxy if defined (e.g., http://localhost:3128)
        if [ -n "$MLC_CACHE_PROXY" ]; then
          echo "Using cache proxy: $MLC_CACHE_PROXY"
          URL=$(echo "$URL" | sed "s|https://github.com|$MLC_CACHE_PROXY/github|")
        fi

        if [ "$OS" == "windows" ] || [ "$OS" == "win32" ]; then
          curl -L $URL -o onnx.zip
          unzip -o onnx.zip -d .onnx_tmp
          cp .onnx_tmp/onnxruntime-win-x64-1.17.0/lib/onnxruntime.dll ./onnxruntime.dll
          rm -f onnx.zip
        else
          curl -L $URL -o onnx.tgz
          tar -xzf onnx.tgz -C .onnx_tmp --strip-components 1
          if [ "$OS" == "darwin" ] || [ "$OS" == "macos" ]; then
            cp .onnx_tmp/lib/libonnxruntime.1.17.0.dylib ./libonnxruntime.dylib
          else
            cp .onnx_tmp/lib/libonnxruntime.so.1.17.0 ./libonnxruntime.so
          fi
          rm -f onnx.tgz
        fi
        rm -rf .onnx_tmp

  preload:
    desc: Preload models (Go version with HF_TOKEN support)
    env:
      ONNX_PATH: "{{.TASKFILE_DIR}}/{{.ONNX_LIB}}"
      GOWORK: "off"
    cmds:
      - ./bin/preloader

  cli:
    desc: "Run CLI test (usage: task cli -- -text 'Hello')"
    env:
      ONNX_PATH: "{{.TASKFILE_DIR}}/{{.ONNX_LIB}}"
      GOWORK: "off"
    cmds:
      - ./bin/cli {{.CLI_ARGS}}

  rpm:
    desc: Build RPM package (requires rpmbuild)
    cmds:
      - task: build
      - mkdir -p build/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
      - |
        VERSION=$(grep "const Version =" internal/api/version.go | cut -d'"' -f2 | sed 's/v//')
        NAME=localembed
        STAGING=build/staging/$NAME-$VERSION
        rm -rf $STAGING
        mkdir -p $STAGING
        # Copy source and binaries to staging
        cp -r cmd internal go.mod go.sum LICENSE README.md config.yaml packaging scripts $STAGING/
        mkdir -p $STAGING/bin
        cp bin/* $STAGING/bin/
        # Check for library - if it doesn't exist, we might be in a dev env without it yet
        if [ -f libonnxruntime.so ]; then cp libonnxruntime.so $STAGING/; fi
        
        # Create empty directory for models
        mkdir -p $STAGING/mlcembed
        
        # Create tarball
        TARBALL=$NAME-$VERSION.tar.gz
        tar -czf build/rpmbuild/SOURCES/$TARBALL -C build/staging $NAME-$VERSION
      - cp packaging/rpm/localembed.spec build/rpmbuild/SPECS/
      - rpmbuild --define "_topdir $(pwd)/build/rpmbuild" -ba build/rpmbuild/SPECS/localembed.spec
      - echo "RPM build complete. Packages available in build/rpmbuild/RPMS/"

  rpm-test:
    desc: Run RPM build and installation test in Docker
    cmds:
      - docker build -t localembed-rpmtest -f Dockerfile.rpmtest .

  package-macos:
    desc: Create macOS App Bundle and DMG
    cmds:
      - chmod +x scripts/build_macos_dmg.sh
      - ./scripts/build_macos_dmg.sh

  install:
    desc: Run the cross-platform installer script
    cmds:
      - chmod +x scripts/install.sh
      - ./scripts/install.sh

  download-tokenizers:
  download-tokenizers:
    desc: Download libtokenizers for the specified platform (PLATFORM=linux/darwin/windows). Fallback to compile if not found.
    vars:
      TARGET_OS: '{{default OS .PLATFORM}}'
    cmds:
      - |
        OS="{{.TARGET_OS}}"
        if [ -z "$OS" ]; then OS=$(uname | tr '[:upper:]' '[:lower:]'); fi
        ARCH=$(uname -m)
        VERSION="v1.26.0"
        echo "Downloading libtokenizers for $OS ($ARCH)..."
        
        EXT="tar.gz"
        if [ "$OS" == "darwin" ] || [ "$OS" == "macos" ]; then
          if [ "$ARCH" == "arm64" ]; then
            FILE="libtokenizers.darwin-arm64.tar.gz"
          else
            FILE="libtokenizers.darwin-x86_64.tar.gz"
          fi
        elif [ "$OS" == "linux" ]; then
          if [ "$ARCH" == "aarch64" ] || [ "$ARCH" == "arm64" ]; then
            FILE="libtokenizers.linux-aarch64.tar.gz"
          else
            FILE="libtokenizers.linux-x86_64.tar.gz"
          fi
        elif [ "$OS" == "windows" ] || [ "$OS" == "win32" ]; then
          # No official windows binary in v1.26.0, fallback to compile
          task compile-tokenizers PLATFORM=windows
          exit 0
        fi

        URL="https://github.com/daulet/tokenizers/releases/download/$VERSION/$FILE"

        # Apply local cache proxy if defined
        if [ -n "$MLC_CACHE_PROXY" ]; then
          echo "Using cache proxy: $MLC_CACHE_PROXY"
          URL=$(echo "$URL" | sed "s|https://github.com|$MLC_CACHE_PROXY/github|")
        fi

        curl -L $URL -o tokenizers.$EXT
        if [ "$EXT" == "zip" ]; then
          unzip -o tokenizers.zip
          # If it extracted something like libtokenizers.windows-amd64.a, rename it
          find . -name "libtokenizers*.a" -exec mv {} libtokenizers.a \; 2>/dev/null || true
          find . -name "tokenizers*.lib" -exec cp {} libtokenizers.a \; 2>/dev/null || true
        else
          tar -xzf tokenizers.tar.gz
          find . -name "libtokenizers*.a" -exec mv {} libtokenizers.a \; 2>/dev/null || true
        fi
        rm -f tokenizers.$EXT
        echo "libtokenizers.a for $OS ready."

  compile-tokenizers:
    desc: Compile libtokenizers from source for the specified platform (requires Rust)
    vars:
      TARGET_OS: '{{default OS .PLATFORM}}'
    cmds:
      - |
        OS="{{.TARGET_OS}}"
        if [ -z "$OS" ]; then OS=$(uname | tr '[:upper:]' '[:lower:]'); fi
        echo "Compiling libtokenizers for $OS..."
        
        # Get source path from go mod cache (force GOWORK off to get absolute path)
        MOD_PATH=$(GOWORK=off go list -m -f '{{.Dir}}' github.com/daulet/tokenizers 2>/dev/null || echo "")
        if [ -z "$MOD_PATH" ] || [ ! -d "$MOD_PATH" ]; then
          echo "Module not in cache, downloading..."
          GOWORK=off go mod download github.com/daulet/tokenizers
          MOD_PATH=$(GOWORK=off go list -m -f '{{.Dir}}' github.com/daulet/tokenizers)
        fi
        
        if [ -z "$MOD_PATH" ] || [ ! -d "$MOD_PATH" ]; then
          echo "Error: github.com/daulet/tokenizers not found even after download"
          exit 1
        fi
        
        echo "Found source at $MOD_PATH"
        
        # Use temporary build dir to keep the mod cache clean
        BUILD_DIR="/tmp/localembed-build-tokenizers-$(date +%s)"
        mkdir -p "$BUILD_DIR"
        # Use . to avoid /* expansion issues
        cp -r "$MOD_PATH/." "$BUILD_DIR/"
        chmod -R +w "$BUILD_DIR"

        cd "$BUILD_DIR"
        
        if [ "$OS" == "windows" ]; then
          # Cross-compile for Windows using MinGW (matches our Go setup)
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/libtokenizers.a "{{.TASKFILE_DIR}}/libtokenizers.a"
        else
          # Native build
          cargo build --release
          cp target/release/libtokenizers.a "{{.TASKFILE_DIR}}/libtokenizers.a"
        fi
        
        cd -
        rm -rf "$BUILD_DIR"
        echo "libtokenizers.a for $OS compiled successfully."
