version: '3'

dotenv: ['.env']

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build all binaries
    env:
      GOWORK: "off"
    cmds:
      - mkdir -p bin
      - go build -o bin/server ./cmd/server/main.go
      - go build -o bin/cli ./cmd/cli/main.go
      - go build -o bin/preloader ./cmd/preloader/main.go

  test:
    desc: Run tests
    env:
      ONNX_PATH: "{{.TASKFILE_DIR}}/libonnxruntime.so"
      GOWORK: "off"
    cmds:
      - go test ./...

  run:
    desc: Run the server (foreground)
    env:
      ONNX_PATH: "{{.TASKFILE_DIR}}/libonnxruntime.so"
      GOWORK: "off"
    cmds:
      - ./bin/server

  start:
    desc: Start the server in background (using PID file)
    env:
      ONNX_PATH: "{{.TASKFILE_DIR}}/libonnxruntime.so"
      GOWORK: "off"
    cmds:
      - |
        if [ -f server.pid ]; then
          PID=$(cat server.pid)
          if kill -0 $PID 2>/dev/null; then
            echo "Server already running (PID $PID)"
            exit 1
          fi
          rm server.pid
        fi
        nohup ./bin/server > server.log 2>&1 &
        sleep 1
        pgrep -f bin/server | head -n 1 > server.pid
        if [ -s server.pid ]; then
          echo "Server started (PID $(cat server.pid), log: server.log)"
        else
          echo "Failed to start server"
          rm server.pid
          exit 1
        fi

  stop:
    desc: Stop the server (using PID file)
    cmds:
      - |
        if [ -f server.pid ]; then
          PID=$(cat server.pid)
          if kill $PID 2>/dev/null; then
             rm server.pid
             echo "Server (PID $PID) stopped"
          else
             echo "Process $PID not found, cleaning up PID file"
             rm server.pid
          fi
        else
          pkill -f bin/server && echo "Server stopped (via pkill)" || echo "Server not running"
        fi

  ping:
    desc: Check server health and stats
    cmds:
      - |
        URL=${MLC_BASE_URL:-"http://localhost:9142"}
        if ! curl -s "$URL/api/health" > /dev/null; then
          echo "Server is NOT running at $URL"
          exit 0
        fi
        echo "--- Health ---"
        curl -s "$URL/api/health" | jq . || curl -s "$URL/api/health"
        echo -e "\n--- Stats ---"
        curl -s "$URL/api/stats" | jq . || curl -s "$URL/api/stats"

  preload:
    desc: Preload models (Go version with HF_TOKEN support)
    env:
      ONNX_PATH: "{{.TASKFILE_DIR}}/libonnxruntime.so"
      GOWORK: "off"
    cmds:
      - ./bin/preloader

  preload-docker:
    desc: Preload models using Python in Docker
    cmds:
      - |
        if [ -z "$HF_TOKEN" ]; then
          echo "HF_TOKEN nicht in .env oder Umgebung gefunden."
          read -p "Hugging Face Token eingeben (oder ENTER für anonym): " token
          export HF_TOKEN=$token
        fi
        docker run --rm -it \
          -v "$(pwd):/app" \
          -w /app \
          -e HF_TOKEN=$HF_TOKEN \
          python:3.11-slim \
          bash -c "pip install --no-cache-dir PyYAML huggingface_hub && python scripts/download_models.py"

  cli:
    desc: "Run CLI test (usage: task cli -- -text 'Hello')"
    env:
      ONNX_PATH: "{{.TASKFILE_DIR}}/libonnxruntime.so"
      GOWORK: "off"
    cmds:
      - ./bin/cli {{.CLI_ARGS}}

  clean:
    desc: Remove binaries
    cmds:
      - rm -rf bin
