stages:
  - build
  - test
  - release

variables:
  GOWORK: "off"
  GOFLAGS: "-modcacherw"
  MLC_CACHE_PROXY: "http://172.16.0.150:3128"

cache:
  paths:
    - bin/
    - mlcembed/ # Modelle cachen, falls der NGINX mal offline ist

.base_task:
  before_script:
    - |
      # Standard GOPATH
      export GOPATH=$CI_BUILDS_DIR/go
      
      # Ensure go/bin is in PATH for task
      export PATH=$PATH:$(go env GOPATH)/bin
      
      if ! command -v task >/dev/null 2>&1; then
        echo "Installing go-task..."
        go install github.com/go-task/task/v3/cmd/task@latest
      fi
      
      # Ensure dependencies are available within the module (ignore go.work)
      export GOWORK=off
      go mod download

.cleanup_task:
  after_script:
    - |
      export GOPATH=$CI_BUILDS_DIR/go
      chmod -R +w $GOPATH/pkg/mod || true

build-linux:
  stage: build
  extends: 
    - .base_task
    - .cleanup_task
  tags:
    - linux
    - build
  script:
    - task download-onnx
    - task download-tokenizers
    - task build
    - mkdir -p bin-linux
    - cp bin/mlcembedder bin/cli bin/preloader bin-linux/
  artifacts:
    paths:
      - bin-linux/

build-macos:
  stage: build
  extends: 
    - .base_task
    - .cleanup_task
  tags:
    - macos
  script:
    - task download-onnx
    - task download-tokenizers
    - task build
    - task package-macos
    - mkdir -p bin-macos
    - cp bin/mlcembedder bin/cli bin/preloader bin-macos/
  artifacts:
    paths:
      - bin-macos/
      - LocalEmbed-*.dmg

build-windows-cross:
  stage: build
  extends: 
    - .base_task
    - .cleanup_task
  tags:
    - windows-cross
  script:
    - echo "Building for Windows (Cross-Compile)..."
    - task download-onnx PLATFORM=windows
    - task download-tokenizers PLATFORM=windows
    - task build PLATFORM=windows
    - mkdir -p bin-windows
    - cp bin/*.exe bin-windows/
  artifacts:
    paths:
      - bin-windows/
  allow_failure: true

test-preload:
  stage: test
  extends: 
    - .base_task
    - .cleanup_task
  tags:
    - linux
    - build
  script:
    - echo "Testing model preloader with cache..."
    - ./bin-linux/preloader <<EOF
      
      EOF
  artifacts:
    paths:
      - mlcembed/
    expire_in: 1 day

test-linux:
  stage: test
  extends: 
    - .base_task
    - .cleanup_task
  tags:
    - linux
  dependencies:
    - build-linux
    - test-preload
  script:
    - cp bin-linux/* bin/
    - task test

test-macos:
  stage: test
  extends: 
    - .base_task
    - .cleanup_task
  tags:
    - macos
  dependencies:
    - build-macos
    - test-preload
  script:
    - cp bin-macos/* bin/
    - task test

release-artifacts:
  stage: release
  tags:
    - linux
    - build
  dependencies:
    - build-linux
    - build-macos
    - build-windows-cross
  script:
    - mkdir -p release_pkgs
    # Pack Linux
    - task download-onnx PLATFORM=linux
    - task download-tokenizers PLATFORM=linux
    - tar -czf release_pkgs/localembed-linux-amd64.tar.gz bin-linux/mlcembedder bin-linux/cli bin-linux/preloader libonnxruntime.so LICENSE README.md config.yaml
    # Pack macOS
    - task download-onnx PLATFORM=darwin
    - task download-tokenizers PLATFORM=darwin
    - tar -czf release_pkgs/localembed-macos-arm64.tar.gz bin-macos/mlcembedder bin-macos/cli bin-macos/preloader libonnxruntime.dylib LICENSE README.md config.yaml
    # Pack Windows
    - task download-onnx PLATFORM=windows
    - task download-tokenizers PLATFORM=windows
    - zip -j release_pkgs/localembed-windows-amd64.zip bin-windows/*.exe onnxruntime.dll LICENSE README.md config.yaml
    # Build Windows Installer (EXE)
    - makensis packaging/windows/localembed.nsi
  artifacts:
    paths:
      - release_pkgs/
