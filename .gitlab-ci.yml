stages:
  - build
  - test
  - release

variables:
  GOWORK: "off"
  GOFLAGS: "-modcacherw"

cache:
  paths:
    - bin/

.base_task:
  before_script:
    - |
      # Set platform specific GOPATH outside of project dir to prevent permission issues
      if [ "$(uname)" == "Darwin" ]; then
        export GOPATH=/tmp/gitlab-go-cache
      else
        export GOPATH=$CI_BUILDS_DIR/go
      fi
      
      # Ensure go/bin is in PATH for task
      export PATH=$PATH:$(go env GOPATH)/bin
      
      if ! command -v task >/dev/null 2>&1; then
        echo "Installing go-task..."
        go install github.com/go-task/task/v3/cmd/task@latest
      fi
      
      # Ensure dependencies are available
      go mod download

.cleanup_task:
  after_script:
    - |
      if [ "$(uname)" == "Darwin" ]; then
        export GOPATH=/tmp/gitlab-go-cache
      else
        export GOPATH=$CI_BUILDS_DIR/go
      fi
      chmod -R +w $GOPATH/pkg/mod || true

build-linux:
  stage: build
  extends: 
    - .base_task
    - .cleanup_task
  tags:
    - linux
    - build
  script:
    - task download-onnx
    - task build
    - mkdir -p bin-linux
    - cp bin/mlcembedder bin/cli bin/preloader bin-linux/
  artifacts:
    paths:
      - bin-linux/

build-macos:
  stage: build
  extends: 
    - .base_task
    - .cleanup_task
  tags:
    - macos
  script:
    - task download-onnx
    - task build
    - task package-macos
    - mkdir -p bin-macos
    - cp bin/mlcembedder bin/cli bin/preloader bin-macos/
  artifacts:
    paths:
      - bin-macos/
      - LocalEmbed-*.dmg

build-windows-cross:
  stage: build
  extends: 
    - .base_task
    - .cleanup_task
  tags:
    - windows-cross
  script:
    - echo "Building for Windows (Cross-Compile)..."
    # Build all components explicitly for Windows with .exe extension
    - GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go build -o bin/mlcembedder.exe ./cmd/server/main.go
    - GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go build -o bin/cli.exe ./cmd/cli/main.go
    - GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go build -o bin/preloader.exe ./cmd/preloader/main.go
    - GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go build -o bin/localembed-gui.exe ./cmd/gui/main.go
    - mkdir -p bin-windows
    - cp bin/*.exe bin-windows/
  artifacts:
    paths:
      - bin-windows/
  allow_failure: true

test-linux:
  stage: test
  extends: 
    - .base_task
    - .cleanup_task
  tags:
    - linux
  dependencies:
    - build-linux
  script:
    - cp bin-linux/* bin/
    - task test

test-macos:
  stage: test
  extends: 
    - .base_task
    - .cleanup_task
  tags:
    - macos
  dependencies:
    - build-macos
  script:
    - cp bin-macos/* bin/
    - task test

release-artifacts:
  stage: release
  tags:
    - linux
    - build
  dependencies:
    - build-linux
    - build-macos
    - build-windows-cross
  script:
    - mkdir -p release_pkgs
    # Pack Linux
    - task download-onnx PLATFORM=linux
    - tar -czf release_pkgs/localembed-linux-amd64.tar.gz bin-linux/mlcembedder bin-linux/cli bin-linux/preloader libonnxruntime.so LICENSE README.md config.yaml
    # Pack macOS
    - task download-onnx PLATFORM=darwin
    - tar -czf release_pkgs/localembed-macos-arm64.tar.gz bin-macos/mlcembedder bin-macos/cli bin-macos/preloader libonnxruntime.dylib LICENSE README.md config.yaml
    # Pack Windows
    - task download-onnx PLATFORM=windows
    - zip -j release_pkgs/localembed-windows-amd64.zip bin-windows/*.exe onnxruntime.dll LICENSE README.md config.yaml
  artifacts:
    paths:
      - release_pkgs/
